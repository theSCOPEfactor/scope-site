{% extends "base.html" %}
{% block body %}
<h1>Trading Journal</h1>
<p class="sub">Month-by-month ledger of every trade: entry, exit, P&amp;L ane tamari thesis, ek j jagya e.</p>

<div class="card row" style="justify-content:space-between">
  <div class="row" style="gap:26px">
    <div class="stat"><small>Capital</small><b id="capital">-</b> <button class="btn sm" onclick="editCap()">✎</button></div>
    <div class="stat"><small>Exposure</small><b id="exposure">-</b></div>
    <div class="stat"><small>Open</small><b id="open">-</b></div>
  </div>
  <div class="row">
    <label class="btn primary">⬆ Import tradebook<input type="file" id="imp" accept=".csv" hidden></label>
    <button class="btn danger" onclick="clearAll()">Clear all</button>
  </div>
</div>

<div class="months" id="months"></div>

<div class="card"><div class="stats" id="stats"></div></div>

<div class="card">
  <div class="wrap"><table>
    <thead><tr><th class="l">Stock</th><th>Dir</th><th>Type</th><th>Qty</th><th>Avg E</th><th>Avg X / LTP</th><th>% Move</th><th>Held</th><th>P&amp;L</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div style="text-align:center;margin-top:10px"><button class="btn" onclick="openForm()">＋ Log new trade</button></div>
</div>

<div class="modal" id="modal"><div class="card">
  <h2 id="mtitle">New trade</h2>
  <div class="form">
    <label>Symbol<input id="f_symbol" list="syms" placeholder="HDFCBANK"></label>
    <label>Direction<select id="f_dir"><option value="L">Long</option><option value="S">Short</option></select></label>
    <label>Qty<input id="f_qty" type="number"></label>
    <label>Type<select id="f_kind"><option value="C">Cash</option><option value="F">F&amp;O</option></select></label>
    <label>Entry price<input id="f_ep" type="number" step="0.05"></label>
    <label>Entry date<input id="f_ed" type="date"></label>
    <label>Exit price (khali = open)<input id="f_xp" type="number" step="0.05"></label>
    <label>Exit date<input id="f_xd" type="date"></label>
    <label class="full">Thesis / note<textarea id="f_note" rows="3"></textarea></label>
  </div>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn" onclick="closeForm()">Cancel</button>
    <button class="btn primary" onclick="saveTrade()">Save</button>
  </div>
</div></div>
<datalist id="syms"></datalist>
{% endblock %}

{% block scripts %}
<script>
let month = new Date().toISOString().slice(0,7), editId = null, DATA = null;
const inr = n => (n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const cls = n => n>0?'pos':(n<0?'neg':'');
const MN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

async function load(){
  const r = await (await fetch('/api/journal?month='+month)).json();
  DATA = r; const s = r.stats;
  capital.textContent = inr(s.capital); exposure.textContent = inr(s.exposure); open.textContent = s.open+' positions';
  // months
  const y = +month.slice(0,4); let h='';
  for(let m=1;m<=12;m++){
    const key = y+'-'+String(m).padStart(2,'0'), v = r.months[key];
    h += `<button class="${key==month?'on':''}" onclick="month='${key}';load()">${MN[m-1]}<i class="${cls(v)}">${v===undefined?'·':inr(v)}</i></button>`;
  }
  months.innerHTML = `<button onclick="shiftY(-1)">‹</button><button disabled>${y}</button><button onclick="shiftY(1)">›</button>`+h;
  const st = (l,v,c='')=>`<div class="stat"><small>${l}</small><b class="${c}">${v}</b></div>`;
  stats.innerHTML = st('Realized',inr(s.realized),cls(s.realized))+st('Unrealized',inr(s.unrealized),cls(s.unrealized))
   +st('Cum. ROI',s.roi+'%',cls(s.roi))+st('W / L',s.wl)+st('Batting avg',s.batting+'%')
   +st('Win %','+'+s.win_pct+'%','pos')+st('Loss %',s.loss_pct+'%','neg')
   +st('Avg held',s.avg_held+'d')+st('W held',s.w_held+'d','pos')+st('L held',s.l_held+'d','neg')
   +st('Win ₹',inr(s.win_amt),'pos')+st('Loss ₹',inr(s.loss_amt),'neg');
  rows.innerHTML = r.trades.length ? r.trades.map(t=>`<tr>
    <td class="l"><b>${t.symbol}</b>${t.note?`<br><small class="mut">${t.note.replace(/</g,'&lt;').slice(0,60)}</small>`:''}</td>
    <td><span class="tag ${t.dir}">${t.dir}</span></td><td>${t.kind}</td><td>${t.qty}</td>
    <td>${t.entry_price.toFixed(2)}</td><td>${t.px==null?'-':t.px.toFixed(2)}${t.closed?'':' <small class="mut">LTP</small>'}</td>
    <td class="${cls(t.pct)}">${t.pct>0?'+':''}${t.pct}%</td><td>${t.held}d</td>
    <td class="${cls(t.pnl)}"><b>${inr(t.pnl)}</b></td>
    <td><button class="btn sm" onclick='openForm(${JSON.stringify(t)})'>✎</button> <button class="btn sm danger" onclick="del(${t.id})">✕</button></td></tr>`).join('')
    : '<tr><td colspan="10" class="empty">Aa mahina ma koi trade nathi. "Log new trade" dabavo athva tradebook import karo.</td></tr>';
}
function shiftY(d){ month = (+month.slice(0,4)+d)+month.slice(4); load(); }
async function editCap(){
  const v = prompt('Capital (₹):', DATA.stats.capital); if(!v) return;
  await fetch('/api/capital',{method:'POST',body:JSON.stringify({capital:+v})}); load();
}
function openForm(t){
  editId = t? t.id : null; mtitle.textContent = t? 'Edit trade':'New trade';
  f_symbol.value=t?t.symbol:''; f_dir.value=t?t.dir:'L'; f_kind.value=t?t.kind:'C'; f_qty.value=t?t.qty:'';
  f_ep.value=t?t.entry_price:''; f_ed.value=t?t.entry_date:new Date().toISOString().slice(0,10);
  f_xp.value=t&&t.exit_price!=null?t.exit_price:''; f_xd.value=t&&t.exit_date?t.exit_date:''; f_note.value=t?t.note:'';
  modal.classList.add('on');
}
function closeForm(){ modal.classList.remove('on'); }
async function saveTrade(){
  const b = {symbol:f_symbol.value,dir:f_dir.value,kind:f_kind.value,qty:f_qty.value,entry_price:f_ep.value,
    entry_date:f_ed.value,exit_price:f_xp.value,exit_date:f_xd.value,note:f_note.value};
  if(!b.symbol||!b.qty||!b.entry_price||!b.entry_date){ alert('Symbol, qty, entry price ane date jaruri che'); return; }
  if(b.exit_price && !b.exit_date) b.exit_date = new Date().toISOString().slice(0,10);
  await fetch(editId?'/api/trade/'+editId:'/api/trade',{method:editId?'PUT':'POST',body:JSON.stringify(b)});
  closeForm(); load();
}
async function del(id){ if(confirm('Aa trade delete karvi?')){ await fetch('/api/trade/'+id,{method:'DELETE'}); load(); } }
async function clearAll(){ if(confirm('BADHI trades delete thase. Pakku?')){ await fetch('/api/clear',{method:'POST'}); load(); } }
imp.onchange = async e=>{
  const fd = new FormData(); fd.append('file', e.target.files[0]);
  const r = await (await fetch('/api/import',{method:'POST',body:fd})).json();
  alert(r.ok? r.created+' trades import thayi' : (r.error||'Import fail')); e.target.value=''; load();
};
fetch('/api/stocks').then(r=>r.json()).then(d=>{ syms.innerHTML = d.stocks.map(s=>`<option value="${s.symbol}">`).join(''); });
load();
</script>
{% endblock %}
