{% extends "base.html" %}
{% block body %}
<div class="pagehead"><div><h1>52-Week Levels</h1><p class="sub">Key price levels for every stock · data updated {{ updated }}</p></div></div>

<div class="card">
  <input id="q" list="syms" placeholder="Search a stock, e.g. RELIANCE" autocomplete="off" style="width:100%;font-size:16px">
  <datalist id="syms"></datalist>
  <div id="detail"><div class="hint">Pick a stock to see its price ladder. Hover a level to highlight it.</div></div>
</div>

<div class="card">
  <div class="filters">
    <label class="fld">Search<input id="s" placeholder="symbol"></label>
    <label class="fld">Zone<select id="zone"><option value="">All</option><option>Above VHIGH</option><option>Near VHIGH (sell zone)</option><option>Inside range</option><option>Near VLOW (buy zone)</option><option>Below VLOW</option></select></label>
    <label class="fld">Stage<select id="stg"><option value="">All</option><option value="2">Stage 2</option><option value="1">Stage 1</option><option value="3">Stage 3</option><option value="4">Stage 4</option><option value="0">New listing</option></select></label>
    <label class="fld">Min avg volume<input id="mv" type="number" value="100000"></label>
  </div>
  <div class="mut" id="count" style="margin-bottom:6px"></div>
  <div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="pager"><button class="btn sm" onclick="pg(-1)">‹ Prev</button><span id="pn"></span><button class="btn sm" onclick="pg(1)">Next ›</button></div>
</div>
{% endblock %}

{% block scripts %}
{% raw %}
<script>
const $=id=>document.getElementById(id);
let ALL=[], VIEW=[], page=0, sortK='symbol', sortD=1; const PS=50;
const f2=n=>n==null?'-':Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ZC={'Above VHIGH':'z-up','Near VHIGH (sell zone)':'z-hi','Inside range':'','Near VLOW (buy zone)':'z-lo','Below VLOW':'z-dn'};
const cols=[['symbol','Stock','l'],['price','Price'],['chg','Chg %'],['point',MAGNET(17)],['vhigh','VHIGH'],['vlow','VLOW'],['pos','Range'],['zone','Zone','l'],['stage','Stage'],['rs','RS']];
$('head').innerHTML=cols.map(c=>`<th class="sort ${c[2]||''}" data-k="${c[0]}">${c[1]}</th>`).join('');
$('head').onclick=e=>{const k=e.target.closest('th')?.dataset.k; if(k) sortBy(k)};

function detail(s){
  const box=$('detail');
  if(!s){box.innerHTML='<div class="hint">Pick a stock to see its price ladder. Hover a level to highlight it.</div>';return}
  if(s.point==null){box.innerHTML=`<div class="hint">${s.symbol}: levels not available yet.</div>`;return}

  box.innerHTML=`<div class="dh"><div><h2 class="sym">${s.symbol}</h2><span class="px">₹${f2(s.price)}</span>
    <span class="${s.chg>=0?'pos':'neg'}" style="margin-left:8px">${s.chg>=0?'+':''}${s.chg}%</span></div>
    <div class="row">${s.stage?`<span class="tag s${s.stage}">Stage ${s.stage}</span>`:'<span class="tag">New listing</span>'}${s.rs!=null?`<span class="rs">RS ${s.rs}</span>`:''}<span class="zone ${ZC[s.zone]||''}">${ZONENAME(s.zone)||''}</span></div></div>
    ${ScopeLadder.html(s)}<a class="btn sm" href="/stock/${s.symbol}" style="margin-top:12px">Full details →</a>`;
  ScopeLadder.bind(box);
}
function pick(sym){ $('q').value=sym; detail(ALL.find(x=>x.symbol==sym)); $('detail').scrollIntoView({behavior:'smooth',block:'center'}); }

function apply(){
  const t=$('s').value.trim().toUpperCase(), z=$('zone').value, st=$('stg').value, mv=+$('mv').value||0;
  VIEW=ALL.filter(x=>x.point!=null&&(!t||x.symbol.includes(t))&&(!z||x.zone==z)&&(!st||x.stage==st)&&x.avg_vol>=mv);
  VIEW.sort((a,b)=>{const A=a[sortK]??-1e18,B=b[sortK]??-1e18;return (A>B?1:A<B?-1:0)*sortD});
  page=0; draw();
}
function sortBy(k){ sortD=sortK==k?-sortD:1; sortK=k; apply(); }
function pg(d){ const m=Math.max(0,Math.ceil(VIEW.length/PS)-1); page=Math.min(m,Math.max(0,page+d)); draw(); }
function draw(){
  $('count').textContent=VIEW.length+' stocks';
  $('pn').textContent=(page+1)+' / '+Math.max(1,Math.ceil(VIEW.length/PS));
  $('rows').innerHTML=VIEW.slice(page*PS,page*PS+PS).map(x=>{
    const p=Math.max(-4,Math.min(104,x.pos*100));
    return `<tr class="clk" data-s="${x.symbol}"><td class="l"><b>${x.symbol}</b></td><td>${f2(x.price)}</td>
      <td class="${x.chg>=0?'pos':'neg'}">${x.chg}</td><td>${f2(x.point)}</td><td>${f2(x.vhigh)}</td><td>${f2(x.vlow)}</td>
      <td><span class="rb"><i style="left:${p}%"></i></span></td><td class="l"><span class="zone ${ZC[x.zone]||''}">${x.zone}</span></td>
      <td>${x.stage?`<span class="tag s${x.stage}">S${x.stage}</span>`:'<span class="tag" title="New listing - not enough history for Stage/RS">NEW</span>'}</td><td>${x.rs??'-'}</td></tr>`}).join('')
    ||'<tr><td colspan="10" class="empty">No data yet. Run the daily job first.</td></tr>';
}
$('rows').onclick=e=>{const tr=e.target.closest('tr[data-s]'); if(tr) pick(tr.dataset.s)};
$('q').oninput=()=>detail(ALL.find(x=>x.symbol==$('q').value.trim().toUpperCase()));
['s','zone','stg','mv'].forEach(i=>$(i).oninput=apply);
fetch('/api/stocks').then(r=>r.json()).then(d=>{
  ALL=d.stocks; ALL.forEach(x=>x.pos=x.vhigh>x.vlow?(x.price-x.vlow)/(x.vhigh-x.vlow):.5);
  $('syms').innerHTML=ALL.map(x=>`<option value="${x.symbol}">`).join(''); apply();
  const sp=new URLSearchParams(location.search).get('s'); if(sp) pick(sp.toUpperCase());
});
</script>
{% endraw %}
{% endblock %}
