{% extends "base.html" %}
{% block header %}{% endblock %}
{% block body %}
<div class="card reg" style="max-width:560px">
  <div class="hero">
    <img class="logo-img" src="{{ url_for('static', filename='logo.svg') }}" alt="Scope logo" style="width:88px;height:88px">
    <span class="wm"><b class="wordmark" style="font-size:64px">Scope</b><i class="flo"></i></span>
    <span class="typer" data-text="precision . vision . success ." style="font-size:9.5px;letter-spacing:.12em;margin:8px auto 0;width:max-content">precision . vision . success .</span>
    <h1 style="margin:16px 0 0;font-size:20px">Create your account</h1>
    <p class="mut" style="margin:4px 0 0">Email OTP login · one device at a time</p>
  </div>
  {% if err %}<p class="neg" style="margin:12px 0 0;text-align:center"><b>{{ err }}</b></p>{% endif %}
  <form method="post" style="margin-top:14px">
    <input type="hidden" name="_csrf" value="{{ csrf() }}">
    <h3 class="sec">Plan</h3>
    <div class="plans">
      <label class="plan"><input type="radio" name="plan" value="trial" {{ 'checked' if f.get('plan','trial')=='trial' }}>
        <b>Free trial</b><span>{{ trial }} days · ₹0</span><small>Only once per person</small></label>
      <label class="plan"><input type="radio" name="plan" value="paid" {{ 'checked' if f.get('plan')=='paid' }}>
        <b>Subscription</b><span>
        {% if plans %}from ₹{{ '{:,}'.format(plans|map(attribute='price')|min) }}{% else %}-{% endif %}</span>
        <small>{% for p in plans %}{{ p['months'] }}{{ ', ' if not loop.last }}{% endfor %} month plans · choose after sign-up</small></label>
    </div>
    <h3 class="sec">Your details</h3>
    <div class="form">
      <label class="fld full">Name<input name="name" value="{{ f.get('name','') }}" required></label>
      <label class="fld">Email (OTP comes here)<input type="email" name="email" value="{{ f.get('email','') }}" required></label>
      <label class="fld">Mobile number<input name="mobile" inputmode="numeric" maxlength="14" value="{{ f.get('mobile','') }}" required></label>
    </div>
    <label class="fld chk" style="margin-top:16px"><input type="checkbox" name="consent" value="1" required>
      <span>I understand Scope is an educational and informational tool, not investment advice, and I agree to the <a href="{{ url_for('terms') }}" target="_blank">Terms &amp; Privacy</a>, including the use of my name, email and mobile for my account.</span></label>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:14px">Register and send OTP</button>
    <p class="note" style="text-align:center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</div>
{% endblock %}
