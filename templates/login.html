{% extends "base.html" %}
{% block bodyclass %}loginpage{% endblock %}
{% block header %}{% endblock %}
{% block body %}
<form method="post" class="card login">
  <div class="hero">
    <img class="logo-img" src="{{ url_for('static', filename='logo.svg') }}" alt="Scope logo">
    <b class="wordmark">SCOPE</b>
    <span class="typer" data-text="CHANGE YOUR VISION">CHANGE YOUR VISION</span>
  </div>
  <input type="password" name="password" placeholder="Password" autofocus>
  {% if err %}<p class="neg" style="margin:0">{{ err }}</p>{% endif %}
  <button class="btn primary" type="submit" style="justify-content:center">Enter</button>
</form>
{% endblock %}
