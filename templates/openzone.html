{% extends "base.html" %}
{% block body %}
<div class="pagehead"><div><h1>Open zone</h1><p class="sub">Open price nakho → levels, ane pehla aa jagya e open thayu tyare su thayu · fakat OPEN ganay che</p></div></div>
<div class="card">
  <div class="row" style="gap:14px;align-items:flex-end">
    <div class="fld"><small class="mut" style="display:block;margin-bottom:4px">Index</small><div class="seg" id="ix"></div></div>
    <label class="fld"><small class="mut" style="display:block;margin-bottom:4px">VLOW</small><input id="v0" type="number" step="any" style="width:130px"></label>
    <label class="fld"><small class="mut" style="display:block;margin-bottom:4px">VHIGH</small><input id="v1" type="number" step="any" style="width:130px"></label>
    <label class="fld"><small class="mut" style="display:block;margin-bottom:4px">Point (POC)</small><input id="pc" type="number" step="any" style="width:130px"></label>
    <label class="fld"><small class="mut" style="display:block;margin-bottom:4px">Open price</small><input id="op" type="number" step="any" style="width:130px"></label>
  </div>
  <p class="note" id="auto"></p>
</div>
<div id="out"></div>
{% endblock %}
{% block scripts %}
{% raw %}
<script>
const $=id=>document.getElementById(id);
const f2=n=>n==null?'-':Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
// ratio internally j vaprai che, screen par kyay dekhatu nathi
const LV=[[1.272,'Extension'],[1,'VHIGH · Breakout'],[0.75,'Upper reversal'],[0.25,'Lower reversal'],[0,'VLOW · Break down'],[-0.272,'Deep reversal 1'],[-0.618,'Deep reversal 2']];
const KN=n=>n.split(' · ')[0];   // stats ma vaprata naam
const sg=x=>(x>=0?'+':'')+x;
const pc=x=>`<span class="${x>=0?'pos':'neg'}">${sg(x)}%</span>`;
let Z=null, cur=null;

function calc(){
  const v0=parseFloat($('v0').value), v1=parseFloat($('v1').value), op=parseFloat($('op').value), pcv=parseFloat($('pc').value);
  if(!(v1>v0)||isNaN(op)){ $('out').innerHTML='<div class="card"><p class="mut">VLOW, VHIGH ane Open nakho (VHIGH moto hovo joiye).</p></div>'; return }
  const rng=v1-v0, r=(op-v0)/rng;
  const items=LV.map(([x,n])=>({x,n,p:v0+rng*x}));
  if(!isNaN(pcv)) items.push({x:null,n:'Point',p:pcv,magnet:true});
  items.sort((a,b)=>b.p-a.p);
  const nu=items.filter(i=>i.p>op).slice(-1)[0], nd=items.filter(i=>i.p<=op)[0];
  const hasPt=!isNaN(pcv);
  const key=nd?(nu?KN(nd.n)+' to '+KN(nu.n):'Above '+KN(nd.n)):'Below '+KN(nu.n);
  const rows=[]; let placed=false;
  items.forEach(l=>{
    if(!placed && l.p<=op){ rows.push(openRow(op)); placed=true }
    const tag=(nu&&l===nu)?'nazik upar':(nd&&l===nd)?'nazik niche':'';
    rows.push(`<tr class="${tag?'hl':''}"><td class="l"><b>${l.magnet?MAGNET(15)+' Point':l.n}</b></td><td>${f2(l.p)}</td><td class="${l.p>=op?'pos':'neg'}">${(l.p>=op?'+':'')+(l.p-op).toFixed(2)}</td><td><small class="mut">${tag}</small></td></tr>`);
  });
  if(!placed) rows.push(openRow(op));
  let zhtml='<p class="mut">Index no data haji nathi (Scope Open Zone job run karo).</p>';
  const E=Z.indices[cur];
  if(E){
    const z=(hasPt?E.zones:(E.zones_np||E.zones))[key], b=E.base;
    const nUp=nu?KN(nu.n):'-', nDn=nd?KN(nd.n):'-';
    if(z && z.n){
      zhtml=`<div class="row" style="justify-content:space-between"><h3 style="margin:0">Open aa jagya e: ${z.label.replace('VHIGH','VHIGH').replace('VLOW','VLOW')}</h3><span class="mut">${z.n} divas · ${E.from} thi ${E.to}</span></div>
      <div class="wrap" style="margin-top:10px"><table><thead><tr><th class="l">Open pachhi</th><th>Aa jagya e</th><th>Badha divas</th></tr></thead><tbody>
        <tr><td class="l">Pehla nazik <b>upar</b> level (${nUp}) aavyu</td><td><b>${z.first_up}%</b></td><td class="mut">-</td></tr>
        <tr><td class="l">Pehla nazik <b>niche</b> level (${nDn}) aavyu</td><td><b>${z.first_dn}%</b></td><td class="mut">-</td></tr>
        <tr><td class="l">Banne ek j candle ma / kai nahi</td><td>${z.first_both}% / ${z.first_none}%</td><td class="mut">-</td></tr>
        <tr><td class="l">Upar level aavya pachhi te level ni <b>niche pachha</b> (close)</td><td>${z.rev_up==null?'<span class="mut">ochha cases</span>':'<b>'+z.rev_up+'%</b> <small class="mut">('+z.n_up+')</small>'}</td><td class="mut">-</td></tr>
        <tr><td class="l">Niche level aavya pachhi te level ni <b>upar pachha</b> (close)</td><td>${z.rev_dn==null?'<span class="mut">ochha cases</span>':'<b>'+z.rev_dn+'%</b> <small class="mut">('+z.n_dn+')</small>'}</td><td class="mut">-</td></tr>
        <tr><td class="l">Open thi divas no high (average)</td><td>${pc(z.avg_up)}</td><td>${pc(b.avg_up)}</td></tr>
        <tr><td class="l">Open thi divas no low (average)</td><td>${pc(z.avg_dn)}</td><td>${pc(b.avg_dn)}</td></tr>
        <tr><td class="l">Divas no close open thi (average)</td><td>${pc(z.avg_cl)}</td><td>${pc(b.avg_cl)}</td></tr>
        <tr><td class="l">Close open karta upar rahyo</td><td>${z.up_days}%</td><td>${b.up_days}%</td></tr>
      </tbody></table></div>
      <h3 style="margin:16px 0 6px">Aa jagya na chhella divas</h3>
      <div class="wrap"><table><thead><tr><th class="l">Date</th><th>Open</th><th>Gap</th><th>High</th><th>Low</th><th>Close</th><th>Pehla</th></tr></thead><tbody>
      ${z.recent.map(d=>`<tr><td class="l">${d.date}</td><td>${f2(d.open)}</td><td>${pc(d.gap)}</td><td>${pc(d.up)}</td><td>${pc(d.dn)}</td><td>${pc(d.cl)}</td><td>${{up:'upar',dn:'niche',both:'banne',none:'kai nahi'}[d.first]}</td></tr>`).join('')}
      </tbody></table></div>`;
    } else zhtml=`<p class="mut">Aa jagya (${key}) e history ma ek pan divas nathi.</p>`;
  }
  $('out').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Levels · open ${f2(op)}</h3>
    <div class="wrap"><table><thead><tr><th class="l">Level</th><th>Price</th><th>Open thi</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>
    <div class="card">${zhtml}
    <p class="note"><b>Vanchvu:</b> aa past na aankda chhe (levels aa site na profile thi). "Badha divas" column baseline chhe: aa jagya ni numbers e baseline karta alag hoy to j kai matlab. Divas ochha hoy to aankda bharosa layak nathi. Aa prediction nathi.</p></div>`;
}
function openRow(op){return `<tr class="open"><td class="l"><b>OPEN</b></td><td><b>${f2(op)}</b></td><td>0</td><td></td></tr>`}

function setIndex(name){
  cur=name; [...$('ix').children].forEach(b=>b.classList.toggle('on',b.dataset.n===name));
  const E=Z.indices[name]; if(!E){ $('auto').textContent='Aa index no data nathi.'; calc(); return }
  const ds=Object.keys(E.levels).sort(), d=ds[ds.length-1], lv=E.levels[d];
  $('v0').value=lv.vlow; $('v1').value=lv.vhigh; $('pc').value=lv.point;
  $('auto').innerHTML=`Aa site e <b>${d}</b> na divas thi gantri karyu: VLOW <b>${f2(lv.vlow)}</b>, VHIGH <b>${f2(lv.vhigh)}</b>, Point ${f2(lv.point)}. Tamara chart na numbers alag hoy to upar potana nakho (VLOW, VHIGH, Point ane Open).`;
  calc();
}
fetch('/api/openzone').then(r=>r.json()).then(d=>{
  Z=d;
  const names=Object.keys(d.indices||{});
  if(!d.updated||!names.length){ $('ix').innerHTML=''; Z.indices={}; cur='Nifty 50';
    $('auto').innerHTML='Open-zone data haji nathi. GitHub → Actions → <b>Scope Open Zone</b> → Run workflow (~5 min), pachhi refresh karo. Tya sudhi VLOW, VHIGH, Open nakhi levels joi shako.';
    calc(); }
  else { $('ix').innerHTML=names.map(n=>`<button data-n="${n}">${n}</button>`).join(''); setIndex(names[0]); }
  $('ix').onclick=e=>{const b=e.target.closest('button'); if(b) setIndex(b.dataset.n)};
});
['v0','v1','pc','op'].forEach(i=>$(i).addEventListener('input',()=>{ if(Z) calc() }));
</script>
<style>tr.hl td{background:rgba(96,165,250,.08)}tr.open td{background:rgba(250,204,21,.16);border-top:1px solid rgba(250,204,21,.5);border-bottom:1px solid rgba(250,204,21,.5)}</style>
{% endraw %}
{% endblock %}
