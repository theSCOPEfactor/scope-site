<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050914">
<title>Scope · Change your vision</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ ver }}">
<script src="{{ url_for('static', filename='app.js') }}?v={{ ver }}"></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="bg"><i></i><i></i><i></i></div>
{% block header %}
<button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side">
  <a class="brand" href="{{ url_for('home') }}" aria-label="Scope - home" data-tip="Scope · Home">
    <img class="logo-img" src="{{ url_for('static', filename='logo.svg') }}" alt="">
    <span class="bt"><b class="wordmark">SCOPE</b><span class="typer" data-text="CHANGE YOUR VISION">CHANGE YOUR VISION</span></span>
  </a>
  <nav class="menu">
    <small>Menu</small>
    <a href="{{ url_for('home') }}" class="{{ 'on' if active=='home' }}" data-tip="Home"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
    <a href="{{ url_for('stock_page') }}" class="{{ 'on' if active=='stock' }}" data-tip="Stock search"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Stock search</span></a>
    <a href="{{ url_for('portfolio') }}" class="{{ 'on' if active=='portfolio' }}" data-tip="Portfolio"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M3 13h18"/></svg><span>Portfolio</span></a>
    <a href="{{ url_for('journal') }}" class="{{ 'on' if active=='journal' }}" data-tip="Trading Journal"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 012 2v16H7a2 2 0 01-2-2z"/><path d="M9 8h6M9 12h6"/></svg><span>Trading Journal</span></a>
    <a href="{{ url_for('journal') }}?tab=plan" class="{{ 'on' if false }}" data-tip="Target plan"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3"/></svg><span>Target plan</span></a>
    <a href="{{ url_for('levels') }}" class="{{ 'on' if active=='levels' }}" data-tip="52W Levels"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h16"/><circle cx="18" cy="12" r="2"/></svg><span>52W Levels</span></a>
    <a href="{{ url_for('stage2') }}" class="{{ 'on' if active=='stage2' }}" data-tip="Stage 2 / RS"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l5-6 4 3 8-11"/><path d="M15 6h5v5"/></svg><span>Stage 2 / RS</span></a>
    <a href="{{ url_for('sectors') }}" class="{{ 'on' if active=='sectors' }}" data-tip="Sectors"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1112 3"/></svg><span>Sectors</span></a>
    <small>Account</small>
    <a href="{{ url_for('backup') }}" data-tip="Download backup"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span>Backup data</span></a>
    <a href="{{ url_for('logout') }}" data-tip="Logout"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Logout</span></a>
  </nav>
  <div id="data-badge" style="padding:8px 10px;margin-top:8px;font-size:11px;color:var(--mut);line-height:1.4;border-top:1px solid var(--stroke)">
  <span id="data-src">Data …</span>
</div>
  <button class="collapse" id="collapse" data-tip="Expand / collapse">&#10094;</button>
</aside>
<script>
(function(){var b=document.body,k='scope_nav';
try{if(localStorage.getItem(k)!=='0')b.classList.add('mini')}catch(e){}
document.getElementById('collapse').onclick=function(){b.classList.toggle('mini');try{localStorage.setItem(k,b.classList.contains('mini')?'1':'0')}catch(e){}};
var o=function(f){b.classList.toggle('drawer',f)};
document.getElementById('burger').onclick=function(){o(!b.classList.contains('drawer'))};
document.getElementById('scrim').onclick=function(){o(false)};})();
</script>
{% endblock %}
<main>{% block body %}{% endblock %}</main>
{% include "_disclaimer.html" %}
{% block scripts %}{% endblock %}
</body>
</html>
