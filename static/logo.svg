<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Scope">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b3a"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="38%" r="72%">
      <stop offset="0" stop-color="#1e3a6e"/>
      <stop offset="1" stop-color="#071028"/>
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M4 32 Q32 8 60 32 Q32 56 4 32 Z"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .blink-m { animation: blink 1.4s ease-in-out infinite; }
    .blink-g { animation: blink 1.4s ease-in-out .45s infinite; }
    .blink-d { animation: blink 1.4s ease-in-out .9s infinite; }
    .orbit { transform-origin:32px 32px; animation:spin 16s linear infinite; }
    @keyframes blink {
      0%,100% { opacity:.25; r:1.2; }
      50% { opacity:1; r:2.1; }
    }
    @keyframes spin { to { transform:rotate(360deg) } }
    @media (prefers-reduced-motion:reduce) {
      .blink-m,.blink-g,.blink-d,.orbit { animation:none!important; opacity:1; }
    }
  </style>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.6"/>

  <!-- eye outline -->
  <path d="M4 32 Q32 8 60 32 Q32 56 4 32 Z" fill="#060b1c" stroke="url(#rim)" stroke-width="1.4"/>

  <!-- iris area -->
  <circle cx="32" cy="32" r="14" fill="url(#iris)"/>

  <!-- India map (simplified), clipped to eye -->
  <g clip-path="url(#eyeClip)">
    <!-- soft iris wash -->
    <circle cx="32" cy="32" r="13.2" fill="#0a162e"/>

    <!-- India silhouette — centered in eye -->
    <g transform="translate(32 33) scale(0.42) translate(-40 -48)">
      <path fill="#3b82f6" fill-opacity=".9" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round"
        d="M42 8
           C48 10 52 16 54 22
           C56 28 55 34 53 40
           C52 46 54 52 50 58
           C46 64 40 68 36 74
           C32 80 30 86 28 90
           C24 86 22 80 20 74
           C16 68 12 62 10 54
           C8 46 6 38 8 30
           C10 22 14 16 20 12
           C26 8 34 6 42 8 Z
           M28 18 C30 14 34 12 38 14 C36 18 32 20 28 18 Z"/>
      <!-- south tip emphasis -->
      <path fill="#60a5fa" d="M28 88 C30 92 32 96 30 98 C28 96 26 92 28 88 Z"/>
    </g>

    <!-- Stock exchange blink points (map coords scaled into eye) -->
    <!-- Mumbai — BSE + NSE (primary) -->
    <circle class="blink-m" cx="27.5" cy="38.5" r="1.8" fill="#f5c04a" filter="url(#glow)"/>
    <circle cx="27.5" cy="38.5" r="3.2" fill="none" stroke="#f5c04a" stroke-opacity=".35" stroke-width=".6">
      <animate attributeName="r" values="2.2;4;2.2" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;0.5" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- GIFT City / Gujarat IFSC -->
    <circle class="blink-g" cx="26" cy="34.5" r="1.3" fill="#34d399" filter="url(#glow)"/>

    <!-- Delhi NCR (financial hub) -->
    <circle class="blink-d" cx="29.5" cy="28.5" r="1.2" fill="#60a5fa" filter="url(#glow)"/>
  </g>

  <!-- orbit ring -->
  <circle class="orbit" cx="32" cy="32" r="15.5" fill="none" stroke="#fff" stroke-opacity=".4"
          stroke-width=".65" stroke-dasharray="2.2 2.6"/>

  <!-- highlight -->
  <circle cx="38" cy="26" r="1.8" fill="#fff" opacity=".75"/>
</svg>
