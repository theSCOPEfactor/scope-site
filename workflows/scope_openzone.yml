name: Scope Open Zone

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * 1-5"   # market band thaya pachhi (5:10 PM IST)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install smartapi-python pyotp logzero websocket-client pandas numpy requests
      - name: Run job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python job/scope_openzone.py
      - name: Commit openzone.json
        run: |
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add openzone.json
          git commit -m "openzone update" || echo "no changes"
          git pull --rebase
          git push
