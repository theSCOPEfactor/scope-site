name: Scope FPI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 1-5,16-20 * *"     # fortnight report aave tyare (mahina ni 1-5 ane 16-20 tarikh), 11:00 IST

permissions:
  contents: write

concurrency:
  group: scope-fpi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas lxml requests
      - name: Run job
        run: python job/scope_fpi.py
      - name: Commit fpiflow.json
        run: |
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add fpiflow.json
          git commit -m "fpi flow update" || echo "no changes"
          git pull --rebase
          git push
