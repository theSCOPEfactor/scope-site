name: Scope Daily Data

on:
  workflow_dispatch:
    inputs:
      max_stocks:
        description: "Test mate stocks ni sankhya (0 = badha)"
        default: "0"
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install smartapi-python pyotp logzero websocket-client pandas numpy requests
      - name: Run job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          MAX_STOCKS: ${{ github.event.inputs.max_stocks || '0' }}
        run: python job/scope_daily.py
      - name: Commit data.json
        run: |
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add data.json
          git commit -m "data update" || echo "no changes"
          git push
