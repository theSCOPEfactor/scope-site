name: Scope Option Volume

on:
  schedule:
    - cron: "*/10 4-9 * * 1-5"      # market hours (9:30 - 15:30 IST) har 10 min
    - cron: "45-59/10 3 * * 1-5"    # 9:15 - 9:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: "1 = market time check chhodo (test mate)"
        default: ""

permissions:
  contents: read

concurrency:
  group: scope-optvol
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Get private data repo
        uses: actions/checkout@v4
        with:
          repository: theSCOPEfactor/scope-data
          token: ${{ secrets.DATA_TOKEN }}
          path: _data
      - name: Restore data files (jobs expect them in the root)
        run: |
          cp _data/optvol.json _data/optvol_state.json . 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install smartapi-python pyotp logzero websocket-client pandas numpy requests
      - name: Run job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OV_FORCE: ${{ github.event.inputs.force }}
        run: python job/scope_optvol.py
      - name: Save data files to the private data repo
        run: |
          cd _data
          for f in optvol.json optvol_state.json; do [ -f "../$f" ] && cp "../$f" . || true; done
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add -A
          git commit -m "option volume update" || echo "no changes"
          for i in 1 2 3 4; do git pull --rebase && git push && break || sleep 6; done
