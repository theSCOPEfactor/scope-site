name: Scope Options

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 3-10 * * 1-5"   # market hours, dar 30 min (IST 8:30 - 16:30)

permissions:
  contents: write

concurrency:
  group: scope-options
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade smartapi-python pyotp logzero websocket-client pandas numpy requests
      - name: Run job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python job/scope_options.py
      - name: Commit options.json
        run: |
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add options.json options_state.json
          git commit -m "options update" || echo "no changes"
          git pull --rebase
          git push
