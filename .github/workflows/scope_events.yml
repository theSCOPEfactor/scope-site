name: Scope Events (results, news, corporate actions)

on:
  workflow_dispatch:
  schedule:
    # Mon-Fri 06:30 IST (01:00 UTC)
    - cron: "0 1 * * 1-5"

permissions:
  contents: read

concurrency:
  group: scope-events
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get private data repo
        uses: actions/checkout@v4
        with:
          repository: theSCOPEfactor/scope-data
          token: ${{ secrets.DATA_TOKEN }}
          path: _data
      - name: Restore data files (jobs expect them in the root)
        run: |
          cp _data/*.json . 2>/dev/null || true
          cp _data/*.gz . 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser requests
      - name: Run job
        run: python job/scope_events.py
      - name: Save data files to the private data repo
        run: |
          cd _data
          for f in events.json; do [ -f "../$f" ] && cp "../$f" . || true; done
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add -A
          git commit -m "events update" || echo "no changes"
          for i in 1 2 3 4; do git pull --rebase && git push && break || sleep 6; done
