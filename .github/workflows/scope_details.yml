name: Scope Details (fundamentals, news, index stocks)

on:
  workflow_dispatch:
    inputs:
      max_details:
        description: "Test mate stocks ni sankhya (600 = badha)"
        default: "600"
  schedule:
    # Mon-Fri 5:50 PM IST (12:20 UTC)
    - cron: "20 12 * * 1-5"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get private data repo
        uses: actions/checkout@v4
        with:
          repository: theSCOPEfactor/scope-data
          token: ${{ secrets.DATA_TOKEN }}
          path: _data
      - name: Restore data files (jobs expect them in the root)
        run: |
          cp _data/*.json . 2>/dev/null || true
          cp _data/*.gz . 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pandas
      - name: Run job
        env:
          MAX_DETAILS: ${{ github.event.inputs.max_details || '600' }}
        run: python job/scope_details.py
      - name: Save data files to the private data repo
        run: |
          cd _data
          for f in details.json; do [ -f "../$f" ] && cp "../$f" . || true; done
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add -A
          git commit -m "details update" || echo "no changes"
          for i in 1 2 3 4; do git pull --rebase && git push && break || sleep 6; done
