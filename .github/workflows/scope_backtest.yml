name: Scope Backtest

on:
  workflow_dispatch:
    inputs:
      max_bt:
        description: "Ketla stocks (400 = badha liquid stocks)"
        default: "400"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install smartapi-python pyotp logzero websocket-client pandas numpy requests
      - name: Run job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          MAX_BT: ${{ github.event.inputs.max_bt || '400' }}
        run: python job/scope_backtest.py
      - name: Commit backtest.json
        run: |
          git config user.name "scope-bot"
          git config user.email "scope-bot@users.noreply.github.com"
          git add backtest.json
          git commit -m "backtest update" || echo "no changes"
          git pull --rebase
          git push
