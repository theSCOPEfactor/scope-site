name: Scope Telegram Auto

# Market time ma darek 30 min (options job pachhi) site ne jagadva: aajna levels hoy to bot auto reading / alert moklse.
on:
  schedule:
    - cron: "10,40 4-9 * * 1-5"     # 09:40 - 15:10 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the site
        env:
          TG_SECRET: ${{ secrets.TG_SECRET }}
        run: |
          if [ -z "$TG_SECRET" ]; then echo "TG_SECRET repo secret nathi - skip"; exit 0; fi
          curl -fsS --max-time 90 "https://scopechangeyourvision.pythonanywhere.com/tg/cron/$TG_SECRET"; echo
